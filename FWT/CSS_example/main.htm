<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>CSS Selectors Example-1</h2>
    <p>This is an element selector.</p>
    <p class='demo'>This paragraph uses a class selector.</p>
    <h3 class='demo'>This heading uses the same class selector.</h3>
    <p id='unique'>This is an ID selector.</p>
    <h2>CSS Selectors Example-2</h2>
    <h4>This is a group selector example.</h4>
    <div id="para">
        <p>This paragraph is inside a div.</p>
    </div>
</body>
</html>
